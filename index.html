<!doctype html>
<!--
THESIS: A familiar photo makes the wrong Edge profile easy to recognize.
OWN-WORLD: The supplied light background, dark frame, and portrait; Inter replaces handwriting.
STORY: Jan sees the reminder, then clicks the browser profile picture above the page.
FIRST VIEWPORT: Portrait left, large message right, curved arrow toward the top-right browser toolbar.
FORM: User-specified composition. No concept selection or generated image is needed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="color-scheme" content="light">
    <title>Hi Jan — Your Edge profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html { background: #f8f9fa; color: #202020; }
      body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .reminder {
        position: relative;
        min-height: calc(100svh - 48px);
        margin: 24px;
        padding: clamp(28px, 4vw, 64px);
        border: 5px solid #202020;
        border-radius: 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        align-items: center;
        gap: clamp(32px, 5vw, 80px);
      }
      .portrait {
        display: block;
        width: 100%;
        max-width: 520px;
        max-height: calc(100svh - 160px);
        object-fit: contain;
        justify-self: center;
      }
      .message { padding-top: clamp(120px, 18vh, 190px); max-width: 660px; }
      h1, .main-message { font-size: clamp(30px, 3.15vw, 52px); font-weight: 600; line-height: 1.3; letter-spacing: -0.025em; }
      h1 { margin: 0 0 1.2em; }
      .main-message { margin: 0; text-wrap: pretty; }
      .instruction { margin: 1.4em 0 0; font-size: clamp(20px, 1.7vw, 28px); line-height: 1.5; max-width: 31ch; }
      .arrow { position: absolute; top: 12px; right: 18px; width: clamp(180px, 27vw, 400px); height: clamp(140px, 24vh, 230px); overflow: visible; pointer-events: none; }
      @media (max-width: 760px) {
        .reminder { margin: 12px; min-height: calc(100svh - 24px); padding: 24px; border-width: 3px; grid-template-columns: 1fr; gap: 32px; }
        .message { grid-row: 1; padding-top: 135px; }
        h1 { margin-bottom: 0.65em; }
        .portrait { width: min(100%, 360px); max-height: none; }
        .arrow { width: 175px; height: 120px; right: 14px; top: 10px; }
        .instruction { font-size: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="reminder" aria-labelledby="greeting">
      <img class="portrait" src="assets/portrait.png" width="819" height="1024" alt="Your husband smiling in his tuxedo" fetchpriority="high" style="height: auto;">
      <div class="message">
        <h1 id="greeting">Hi Jan,</h1>
        <p class="main-message">You probably want to use the other Edge profile.</p>
        <p class="instruction">Click the profile picture at the top right of Edge. Then choose your other profile.</p>
      </div>
      <svg class="arrow" viewBox="0 0 360 220" fill="none" aria-hidden="true">
        <path d="M 18 207 C 90 109, 203 52, 339 16 M 315 12 L 339 16 L 328 40" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </main>
  </body>
</html>
